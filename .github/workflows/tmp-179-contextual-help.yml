name: Temporary
on:
  push:
    branches: [feat/179-contextual-help-links]
permissions:
  contents: write
jobs:
  contextual-help:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded contextual-help patch
        run: python .github/scripts/tmp-179-contextual-help.py
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm install --frozen-lockfile
      - name: Remove temporary files and constrain diff
        shell: bash
        run: |
          git rm .github/workflows/tmp-179-contextual-help.yml .github/scripts/tmp-179-contextual-help.py
          allowed='artifacts/mahjong-scorer/src/App.tsx|artifacts/mahjong-scorer/src/game/GameScorer.tsx|.github/workflows/tmp-179-contextual-help.yml|.github/scripts/tmp-179-contextual-help.py'
          unexpected=$(git status --short | sed -E 's/^.. //' | grep -Ev "^(${allowed})$" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi
      - name: Verify product
        run: |
          pnpm test
          pnpm run typecheck
          PORT=5173 BASE_PATH=/ pnpm run build
      - name: Commit verified contextual help links
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add contextual User Guide links'
          git push
