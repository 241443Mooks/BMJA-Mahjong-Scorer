name: Verify PR 172

on:
  push:
    branches:
      - feature/162-homepage-structure
    paths:
      - .github/workflows/pr172-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PORT: 5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
