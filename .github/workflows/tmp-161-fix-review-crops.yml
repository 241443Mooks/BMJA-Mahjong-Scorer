name: Temporary #161 reviewed screenshot crop fixes

on:
  push:
    branches:
      - chore/161-product-screenshot-library

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refine score and settlement captures
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('artifacts/mahjong-scorer/scripts/capture-help-screenshots.mjs')
          text = path.read_text()

          old_score = "  const scoreCard = page.getByText('Current score', { exact: true }).locator('xpath=ancestor::section[1]');\n  await captureElement(\n    page,\n    scoreCard,\n    `hand-score-result-${viewport.name}.png`,"
          new_score = "  const scoreHeader = page.getByText('Current score', { exact: true }).locator('xpath=ancestor::section[1]/div[1]');\n  await captureElement(\n    page,\n    scoreHeader,\n    `hand-score-result-${viewport.name}.png`,"
          if text.count(old_score) != 1:
              raise SystemExit(f'expected one score-result capture block, found {text.count(old_score)}')
          text = text.replace(old_score, new_score, 1)

          old_settlement = "  const settlement = page.getByTestId('section-settlement-stage');\n  await settlement.waitFor({ state: 'visible' });\n  await captureElement("
          new_settlement = "  const settlement = page.getByTestId('section-settlement-stage');\n  await settlement.waitFor({ state: 'visible' });\n  if (viewport.name === 'mobile') {\n    await page.locator('.screen-only.sticky').first().evaluate((element) => {\n      element.style.setProperty('display', 'none', 'important');\n    });\n  }\n  await captureElement("
          if text.count(old_settlement) != 1:
              raise SystemExit(f'expected one settlement capture block, found {text.count(old_settlement)}')
          text = text.replace(old_settlement, new_settlement, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- artifacts/mahjong-scorer/scripts/capture-help-screenshots.mjs
      - name: Install dependencies
        run: |
          npm install --global pnpm@10.15.1
          pnpm install --frozen-lockfile
      - name: Regenerate screenshot library
        run: pnpm --filter @workspace/mahjong-scorer screenshots:help
      - name: Remove temporary workflow and verify scope
        shell: bash
        run: |
          rm .github/workflows/tmp-161-fix-review-crops.yml
          python <<'PY'
          import subprocess
          allowed = 'artifacts/mahjong-scorer/scripts/capture-help-screenshots.mjs'
          prefix = 'artifacts/mahjong-scorer/public/help/screenshots/'
          changed = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          unexpected = []
          for line in changed:
              path = line[3:]
              if path == '.github/workflows/tmp-161-fix-review-crops.yml':
                  continue
              if path != allowed and not path.startswith(prefix):
                  unexpected.append(path)
          if unexpected:
              raise SystemExit('Unexpected changes: ' + ', '.join(unexpected))
          PY
          git diff --check
      - name: Verify product
        run: |
          pnpm test
          pnpm run typecheck
          PORT=5173 BASE_PATH=/ pnpm run build
      - name: Commit reviewed capture refinements
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Refine product screenshot capture boundaries"
          git push origin HEAD:chore/161-product-screenshot-library
