name: Temporary WCAG audit

on:
  push:
    branches:
      - fix/170-wcag-aa-readability

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install temporary browser audit tools
        run: |
          mkdir -p /tmp/a11y
          printf '{"private":true}' > /tmp/a11y/package.json
          npm install --prefix /tmp/a11y --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          node /tmp/a11y/node_modules/playwright/cli.js install --with-deps chromium
      - name: Wait for branch preview
        run: |
          for i in $(seq 1 90); do
            if curl -fsS https://fix-170-wcag-aa-readability.bmja-mahjong-scorer.pages.dev/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run focused rendered checks
        run: |
          node --input-type=commonjs <<'NODE'
          const { createRequire } = require('node:module');
          const req = createRequire('/tmp/a11y/package.json');
          const { chromium } = req('playwright');
          const AxeBuilder = req('@axe-core/playwright').default;
          const base = 'https://fix-170-wcag-aa-readability.bmja-mahjong-scorer.pages.dev';

          (async () => {
            const browser = await chromium.launch({ headless: true });
            let failures = 0;

            async function audit(page, label) {
              const result = await new AxeBuilder({ page })
                .withTags(['wcag2a', 'wcag2aa', 'wcag21aa', 'wcag22aa'])
                .analyze();
              if (!result.violations.length) {
                console.log(`AXE PASS — ${label}`);
                return;
              }
              failures += result.violations.length;
              console.log(`\nAXE VIOLATIONS — ${label}`);
              for (const violation of result.violations) {
                console.log(`${violation.id} | ${violation.impact} | nodes=${violation.nodes.length}`);
                for (const node of violation.nodes) {
                  console.log(`TARGET ${node.target.join(' ')}`);
                  console.log(`HTML ${node.html}`);
                  const checks = [...node.any, ...node.all, ...node.none]
                    .filter((check) => check.data)
                    .map((check) => ({ id: check.id, data: check.data }));
                  if (checks.length) console.log(`CHECKS ${JSON.stringify(checks)}`);
                }
              }
            }

            async function diagnostics(page, label) {
              await page.setViewportSize({ width: 320, height: 900 });
              const widths = await page.evaluate(() => ({
                docScrollWidth: document.documentElement.scrollWidth,
                docClientWidth: document.documentElement.clientWidth,
              }));
              console.log(`REFLOW — ${label}: ${JSON.stringify(widths)}`);
              await page.addStyleTag({ content: `*{line-height:1.5em!important;letter-spacing:.12em!important;word-spacing:.16em!important} p{margin-bottom:2em!important}` });
              const clipped = await page.evaluate(() => [...document.querySelectorAll('*')].filter((el) => {
                const s = getComputedStyle(el);
                if (!el.textContent?.trim()) return false;
                if (!['hidden','clip'].includes(s.overflow) && !['hidden','clip'].includes(s.overflowX) && !['hidden','clip'].includes(s.overflowY)) return false;
                return el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;
              }).slice(0, 30).map((el) => ({ tag: el.tagName, text: el.textContent.trim().slice(0, 80), className: typeof el.className === 'string' ? el.className : '' })));
              console.log(`TEXT-SPACING CLIP CANDIDATES — ${label}: ${JSON.stringify(clipped)}`);
            }

            for (const route of ['/game', '/hand']) {
              const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
              const page = await context.newPage();
              await page.goto(base + route, { waitUntil: 'networkidle' });
              await audit(page, route);
              await diagnostics(page, route);
              await context.close();
            }

            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            await page.goto(base + '/game', { waitUntil: 'networkidle' });
            await page.getByTestId('input-player-east').fill('Alex');
            await page.getByTestId('input-player-south').fill('Beth');
            await page.getByTestId('input-player-west').fill('Chris');
            await page.getByTestId('input-player-north').fill('Dee');
            await page.getByTestId('button-start-game').click();
            await audit(page, 'active game — score entry');
            for (const [id, score] of [['player-1','80'],['player-2','200'],['player-3','40'],['player-4','60']]) await page.getByTestId(`input-score-${id}`).fill(score);
            await audit(page, 'active game — settlement preview');
            await diagnostics(page, 'active game — settlement preview');
            await page.getByTestId('button-confirm-hand').click();
            await page.locator('#game-ledger').evaluate((el) => { el.open = true; });
            await audit(page, 'active game — confirmed history');
            await context.close();
            await browser.close();
            if (failures) process.exit(2);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
