name: Temporary #178 final patch

on:
  push:
    branches:
      - fix/178-keyboard-scroll-regions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch Gameplay Basics TileGroup
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('artifacts/mahjong-scorer/src/guide/GameplayBasics.tsx')
          text = path.read_text()
          old = '''      <div className="flex gap-1.5 overflow-x-auto pb-1">\n        {tiles.map((tile, index) => (\n          <Tile key={`${name}-${tile.asset}-${index}`} {...tile} compact />\n        ))}\n      </div>'''
          new = '''      <HorizontalScrollRegion label={`${name} tile example`} className="pb-1">\n        <div className="flex min-w-max gap-1.5">\n          {tiles.map((tile, index) => (\n            <Tile key={`${name}-${tile.asset}-${index}`} {...tile} compact />\n          ))}\n        </div>\n      </HorizontalScrollRegion>'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one TileGroup scroll wrapper, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/tmp-178-final-patch.yml').unlink()
          PY
      - name: Install pnpm and dependencies
        run: |
          npm install --global pnpm@10.15.1
          pnpm install --frozen-lockfile
      - name: Verify
        run: |
          pnpm test
          pnpm run typecheck
          PORT=5173 BASE_PATH=/ pnpm run build
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Cover remaining Gameplay Basics scroll regions"
          git push origin HEAD:fix/178-keyboard-scroll-regions
