name: One-off stale branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  delete-classified-stale-branches:
    if: github.repository == '241443Mooks/BMJA-Mahjong-Scorer'
    runs-on: ubuntu-latest
    steps:
      - name: Delete exactly the 108 classified stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          keep_branch() {
            case "$1" in
              main|feature/practice-mode-lightweight-spec|feature/product-insight-feedback|issue-95-rule-deep-links|content/158-about-journey)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          mapfile -t branches < <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')
          candidates=()

          for branch in "${branches[@]}"; do
            if keep_branch "$branch"; then
              echo "KEEP    $branch"
            else
              candidates+=("$branch")
            fi
          done

          echo "Candidate delete count: ${#candidates[@]}"
          if [[ ${#candidates[@]} -ne 108 ]]; then
            echo "Refusing to delete: expected exactly 108 classified stale branches."
            printf 'CANDIDATE %s\n' "${candidates[@]}"
            exit 1
          fi

          for branch in "${candidates[@]}"; do
            echo "DELETE  $branch"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          done

          mapfile -t remaining < <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')
          printf 'REMAIN  %s\n' "${remaining[@]}"

          if [[ ${#remaining[@]} -ne 5 ]]; then
            echo "Unexpected final branch count: ${#remaining[@]} (expected 5 while About PR #169 is active)."
            exit 1
          fi
