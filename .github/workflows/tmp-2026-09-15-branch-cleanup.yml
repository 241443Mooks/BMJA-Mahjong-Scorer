name: Temporary 15 Sep branch cleanup

on:
  push:
    branches:
      - docs/2026-09-15-repo-reset

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact pre-cleanup branch set
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-before <<'EOF'
          chore/161-product-screenshot-library
          chore/161-refresh-help-screenshots
          chore/171-seo-crawl-alignment
          content/158-about-journey
          docs/2026-09-15-repo-reset
          docs/codex-efficient-verification
          feat/163-visual-how-it-works
          feat/179-contextual-help-links
          feat/179-user-guide-phase-a
          feature/162-homepage-structure
          feature/practice-mode-lightweight-spec
          feature/product-insight-feedback
          fix/170-wcag-aa-readability
          fix/177-public-page-contrast
          fix/178-keyboard-scroll-regions
          issue-95-rule-deep-links
          main
          tmp/161-visual-review
          tmp/161-visual-review-2
          EOF
          sort -o /tmp/expected-before /tmp/expected-before
          git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort > /tmp/actual-before
          diff -u /tmp/expected-before /tmp/actual-before
          test "$(wc -l < /tmp/actual-before)" -eq 19

      - name: Delete only the proven-safe refs
        shell: bash
        run: |
          set -euo pipefail
          delete=(
            'chore/161-product-screenshot-library'
            'chore/161-refresh-help-screenshots'
            'chore/171-seo-crawl-alignment'
            'content/158-about-journey'
            'docs/codex-efficient-verification'
            'feat/163-visual-how-it-works'
            'feat/179-contextual-help-links'
            'feat/179-user-guide-phase-a'
            'feature/162-homepage-structure'
            'fix/170-wcag-aa-readability'
            'fix/177-public-page-contrast'
            'fix/178-keyboard-scroll-regions'
            'tmp/161-visual-review'
            'tmp/161-visual-review-2'
          )
          test "${#delete[@]}" -eq 14
          git push origin --delete "${delete[@]}"

      - name: Verify only intended refs remain
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-after <<'EOF'
          docs/2026-09-15-repo-reset
          feature/practice-mode-lightweight-spec
          feature/product-insight-feedback
          issue-95-rule-deep-links
          main
          EOF
          sort -o /tmp/expected-after /tmp/expected-after
          git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort > /tmp/actual-after
          diff -u /tmp/expected-after /tmp/actual-after
          test "$(wc -l < /tmp/actual-after)" -eq 5
