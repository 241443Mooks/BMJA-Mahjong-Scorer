name: Temporary #177 contrast audit

on:
  push:
    branches:
      - fix/177-public-page-contrast

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install temporary browser audit tools
        run: |
          mkdir -p /tmp/a11y
          printf '{"private":true}' > /tmp/a11y/package.json
          npm install --prefix /tmp/a11y --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          node /tmp/a11y/node_modules/playwright/cli.js install --with-deps chromium
      - name: Audit production contrast
        run: |
          node --input-type=commonjs <<'NODE'
          const { createRequire } = require('node:module');
          const req = createRequire('/tmp/a11y/package.json');
          const { chromium } = req('playwright');
          const AxeBuilder = req('@axe-core/playwright').default;
          const base = 'https://mahjong.smooks.co.uk';
          const routes = [
            '/rules', '/rules/british', '/rules/western', '/features', '/how-it-works',
            '/help', '/about', '/mahjong-settlement', '/gameplay-basics', '/guide',
            '/special-hands', '/scoring-examples', '/mahjong-rules-compared'
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            let failures = 0;
            for (const route of routes) {
              const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
              const page = await context.newPage();
              await page.goto(base + route, { waitUntil: 'networkidle' });
              const result = await new AxeBuilder({ page }).withRules(['color-contrast']).analyze();
              const violation = result.violations.find(v => v.id === 'color-contrast');
              if (!violation) {
                console.log(`CONTRAST PASS — ${route}`);
              } else {
                failures += violation.nodes.length;
                console.log(`\nCONTRAST FAIL — ${route} — nodes=${violation.nodes.length}`);
                for (const node of violation.nodes) {
                  const checks = [...node.any, ...node.all, ...node.none]
                    .filter(check => check.id === 'color-contrast' && check.data)
                    .map(check => check.data);
                  console.log(`TARGET ${node.target.join(' ')}`);
                  console.log(`HTML ${node.html}`);
                  console.log(`DATA ${JSON.stringify(checks)}`);
                }
              }
              await context.close();
            }
            await browser.close();
            console.log(`\nTOTAL CONTRAST FAILING NODES: ${failures}`);
            if (failures) process.exit(2);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
