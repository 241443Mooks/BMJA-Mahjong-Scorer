name: Generate help screenshot pilot

on:
  push:
    branches:
      - feature/issue-53-responsive-howto
    paths:
      - artifacts/mahjong-scorer/scripts/capture-help-screenshots.mjs
      - artifacts/mahjong-scorer/package.json
      - .github/workflows/help-screenshot-pilot.yml

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[screenshots]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-53-responsive-howto

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture pilot screenshots
        run: pnpm --filter @workspace/mahjong-scorer screenshots:help

      - name: Commit generated screenshots
        run: |
          git add artifacts/mahjong-scorer/public/help/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add generated help screenshot pilot [screenshots]"
          git push origin HEAD:feature/issue-53-responsive-howto
