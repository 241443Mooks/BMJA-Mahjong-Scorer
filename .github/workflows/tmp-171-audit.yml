name: Temporary 171 SSR probe
on:
  push:
    branches: [chore/171-seo-crawl-alignment]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin pnpm and install
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm install --frozen-lockfile
      - name: Probe SSR compatibility for every canonical route
        run: PORT=4173 BASE_PATH=/ node artifacts/mahjong-scorer/scripts/tmp-171-ssr-probe.mjs
