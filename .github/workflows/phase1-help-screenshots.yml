name: Validate Phase 1 help screenshots

on:
  push:
    branches:
      - feature/issue-57-phase1-howtos
    paths:
      - artifacts/mahjong-scorer/src/home/HelpPage.tsx
      - artifacts/mahjong-scorer/src/home/helpPhase1Instructions.ts
      - artifacts/mahjong-scorer/scripts/capture-help-screenshots.mjs
      - artifacts/mahjong-scorer/public/help/screenshots/README.md
      - .github/workflows/phase1-help-screenshots.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-57-phase1-howtos

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Initialise tile artwork
        run: git submodule update --init --recursive --depth 1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @workspace/mahjong-scorer test

      - name: Typecheck
        run: pnpm --filter @workspace/mahjong-scorer typecheck

      - name: Build
        env:
          PORT: 4173
          BASE_PATH: /
        run: pnpm --filter @workspace/mahjong-scorer build

      - name: Generate and smoke-test all Phase 1 screenshots
        run: pnpm --filter @workspace/mahjong-scorer screenshots:help

      - name: Commit generated screenshots
        run: |
          git add artifacts/mahjong-scorer/public/help/screenshots
          if git diff --cached --quiet; then
            echo "Phase 1 screenshots are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate full Phase 1 help screenshots [screenshots]"
          git push origin HEAD:feature/issue-57-phase1-howtos
