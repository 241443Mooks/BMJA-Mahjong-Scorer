name: Temporary
on:
  push:
    branches:
      - feat/179-user-guide-phase-a
permissions:
  contents: write
jobs:
  build-user-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded patch
        run: python .github/scripts/tmp-179-phase-a.py
      - name: Install dependencies
        run: |
          npm install --global pnpm@10.20.0
          pnpm install --frozen-lockfile
      - name: Remove temporary files and constrain diff
        run: |
          git rm .github/workflows/tmp-179-phase-a.yml .github/scripts/tmp-179-phase-a.py
          allowed='CHANGELOG.md|artifacts/mahjong-scorer/src/components/SiteHeader.test.ts|artifacts/mahjong-scorer/src/components/SiteHeader.tsx|artifacts/mahjong-scorer/src/home/HelpPage.tsx|artifacts/mahjong-scorer/src/home/HowItWorksPage.tsx|artifacts/mahjong-scorer/src/site-seo.json|artifacts/mahjong-scorer/src/site-seo.test.ts|.github/workflows/tmp-179-phase-a.yml|.github/scripts/tmp-179-phase-a.py'
          unexpected=$(git status --short | sed -E 's/^.. //' | grep -Ev "^(${allowed})$" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi
      - name: Verify product
        run: |
          pnpm test
          pnpm run typecheck
          PORT=5173 BASE_PATH=/ pnpm run build
      - name: Commit verified User Guide integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote Help to Table Companion User Guide'
          git push
