name: Temporary
on:
  push:
    branches: [feat/179-user-guide-phase-a]
permissions:
  contents: write
jobs:
  user-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded User Guide integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          help_page = 'artifacts/mahjong-scorer/src/home/HelpPage.tsx'
          replace_once(help_page,
              '<span className="font-mono text-[10px] uppercase tracking-[.2em] text-[#ae6249]">Help</span>',
              '<span className="font-mono text-[10px] uppercase tracking-[.2em] text-[#ae6249]">User Guide &amp; Help</span>')
          replace_once(help_page,
              'Find the thing you need without reading a manual.',
              'Use Mahjong Reference at the table without hunting for instructions.')
          replace_once(help_page,
              'Search a question or browse by task. The answers start with what you can do now, then explain the evidence boundary only where it matters.',
              'Search a question or browse by task. This guide covers game tracking, hand scoring, settlement, recovery and saving across the supported Table Companion workflows; rules-specific learning stays in the Rules and Learn areas.')
          replace_once(help_page,
              '<a href="/hand" className="mt-5 inline-flex min-h-10 items-center gap-2 rounded-md border border-[#c9b99d] bg-[#fdfbf5] px-4 text-[12px] font-semibold text-[#284d45] transition hover:bg-[#fffaf0] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ae6249]">Open the hand scorer <ArrowRight size={14} aria-hidden="true" /></a>',
              '''<div className="mt-5 flex flex-col gap-3 sm:flex-row">
              <a href="/game" className="inline-flex min-h-10 items-center justify-center gap-2 rounded-md bg-[#284d45] px-4 text-[12px] font-semibold text-[#f8f4e9] transition hover:bg-[#23443d] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ae6249] focus-visible:ring-offset-2">Track a game <ArrowRight size={14} aria-hidden="true" /></a>
              <a href="/hand" className="inline-flex min-h-10 items-center justify-center gap-2 rounded-md border border-[#c9b99d] bg-[#fdfbf5] px-4 text-[12px] font-semibold text-[#284d45] transition hover:bg-[#fffaf0] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ae6249]">Score a hand <ArrowRight size={14} aria-hidden="true" /></a>
            </div>''')
          replace_once(help_page, '<span className="sr-only">Search help</span>', '<span className="sr-only">Search User Guide and Help</span>')
          replace_once(help_page,
              'Try a shorter phrase such as “partial”, “Kong”, “settlement” or “save”. You can also use the British scoring guide and British special-hand catalogue below.',
              'Try a shorter phrase such as “partial”, “Kong”, “settlement” or “save”. You can also use the supported rules hub or the explicitly British learning material below.')
          replace_once(help_page,
              'Need the rules rather than the app help?',
              'Need rules or learning rather than product help?')
          replace_once(help_page,
              "['/how-it-works', CircleHelp, 'How it works', 'See how evidence, scoring, settlement and the ledger fit together.']",
              "['/how-it-works', CircleHelp, 'How the Table Companion works', 'See the product model from context and evidence through score, settlement and record.']")

          header = 'artifacts/mahjong-scorer/src/components/SiteHeader.tsx'
          replace_once(header,
              'export const secondaryDestinations = [',
              "export const supportDestination = ['User Guide', '/help'] as const;\n\nexport const secondaryDestinations = [")
          replace_once(header, "  ['Help', '/help'],\n", '')
          replace_once(header,
              '''          ))}
          <div className="relative">''',
              '''          ))}
          <a href={supportDestination[1]} onClick={(event) => navigate(event, supportDestination[1])} className="flex min-h-11 items-center rounded-md px-3 text-[15px] font-semibold text-[#284d45] transition hover:bg-[#efe8da] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ae6249]">{supportDestination[0]}</a>
          <div className="relative">''')
          replace_once(header,
              '''              <div className="mt-1 border-t border-[#e2d9c7] pt-2">
                <div className="px-3 pb-1 pt-1 font-mono text-[12px] uppercase tracking-[.14em] text-[#ae6249]">More</div>''',
              '''              <a href={supportDestination[1]} onClick={(event) => navigate(event, supportDestination[1])} className="mt-1 flex min-h-11 items-center rounded-lg border-t border-[#e2d9c7] px-3 pt-2 text-[15px] font-semibold text-[#284d45] transition hover:bg-[#efe8da] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ae6249]">{supportDestination[0]}</a>
              <div className="mt-1 border-t border-[#e2d9c7] pt-2">
                <div className="px-3 pb-1 pt-1 font-mono text-[12px] uppercase tracking-[.14em] text-[#ae6249]">More</div>''')

          header_test = 'artifacts/mahjong-scorer/src/components/SiteHeader.test.ts'
          replace_once(header_test,
              "import { navigationGroups, secondaryDestinations } from './SiteHeader';",
              "import { navigationGroups, secondaryDestinations, supportDestination } from './SiteHeader';")
          replace_once(header_test,
              '''  it('keeps Features in the secondary More menu', () => {
    expect(secondaryDestinations).toEqual([
      ['Features', '/features'],
      ['Help', '/help'],
      ['How it works', '/how-it-works'],
      ['About', '/about'],
    ]);
  });''',
              '''  it('promotes the User Guide while keeping lower-priority pages in More', () => {
    expect(supportDestination).toEqual(['User Guide', '/help']);
    expect(secondaryDestinations).toEqual([
      ['Features', '/features'],
      ['How it works', '/how-it-works'],
      ['About', '/about'],
    ]);
  });''')

          hiw = 'artifacts/mahjong-scorer/src/home/HowItWorksPage.tsx'
          replace_once(hiw,
              '''              <a href="/hand" className="inline-flex items-center justify-center gap-2 rounded-md border border-[#c9b99d] bg-[#fdfbf5] px-4 py-2.5 text-[11px] font-semibold text-[#284d45] transition hover:bg-[#fffaf0] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ae6249] focus-visible:ring-offset-2">Score a hand <ArrowRight size={14} /></a>
            </div>''',
              '''              <a href="/hand" className="inline-flex items-center justify-center gap-2 rounded-md border border-[#c9b99d] bg-[#fdfbf5] px-4 py-2.5 text-[11px] font-semibold text-[#284d45] transition hover:bg-[#fffaf0] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ae6249] focus-visible:ring-offset-2">Score a hand <ArrowRight size={14} /></a>
              <a href="/help" className="inline-flex items-center justify-center gap-2 rounded-md border border-[#c9b99d] bg-[#fdfbf5] px-4 py-2.5 text-[11px] font-semibold text-[#284d45] transition hover:bg-[#fffaf0] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ae6249] focus-visible:ring-offset-2">Open User Guide <ArrowRight size={14} /></a>
            </div>''')

          seo = 'artifacts/mahjong-scorer/src/site-seo.json'
          replace_once(seo,
              '{ "path": "/how-it-works", "title": "How British Mahjong Scoring Works | Mahjong Reference", "description": "See how the scorer moves from game context and tile evidence to scoring, explanations, settlement and the final game record.", "indexable": true }',
              '{ "path": "/how-it-works", "title": "How the Mahjong Table Companion Works | Mahjong Reference", "description": "See how Mahjong Reference moves from rules and game context through hand evidence, scoring, explanations, settlement and the final game record.", "indexable": true }')
          replace_once(seo,
              '{ "path": "/help", "title": "British Mahjong Scoring Help | Mahjong Reference", "description": "Get practical help with scoring games and hands, partial evidence, special situations, recovery, settlement and saving a game record.", "indexable": true }',
              '{ "path": "/help", "title": "User Guide & Help | Mahjong Reference", "description": "Use Mahjong Reference to track a game, score hands, understand settlement, recover play and save records, with practical help for supported Table Companion workflows.", "indexable": true }')

          seo_test = 'artifacts/mahjong-scorer/src/site-seo.test.ts'
          replace_once(seo_test,
              '''    expect(siteSeo.routes.find((route) => route.path === '/rules/western')?.description).toContain('provisional ordinary-rule boundary');''',
              '''    expect(siteSeo.routes.find((route) => route.path === '/rules/western')?.description).toContain('provisional ordinary-rule boundary');
    expect(siteSeo.routes.find((route) => route.path === '/help')?.title).toContain('User Guide & Help');
    expect(siteSeo.routes.find((route) => route.path === '/help')?.description).toContain('Table Companion workflows');
    expect(siteSeo.routes.find((route) => route.path === '/how-it-works')?.title).toContain('Mahjong Table Companion');''')

          changelog = 'CHANGELOG.md'
          replace_once(changelog,
              '### Changed\n\n- Aligned the homepage',
              '### Changed\n\n- Promoted **User Guide & Help** into a product-wide Table Companion support surface, with first-class navigation and a clear hand-off from How It Works while keeping British learning and rules content distinct. [#179](https://github.com/241443Mooks/BMJA-Mahjong-Scorer/issues/179)\n- Aligned the homepage')
          PY
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Remove temporary workflow and constrain diff
        shell: bash
        run: |
          git rm .github/workflows/tmp-179-phase-a.yml
          allowed='CHANGELOG.md|artifacts/mahjong-scorer/src/components/SiteHeader.test.ts|artifacts/mahjong-scorer/src/components/SiteHeader.tsx|artifacts/mahjong-scorer/src/home/HelpPage.tsx|artifacts/mahjong-scorer/src/home/HowItWorksPage.tsx|artifacts/mahjong-scorer/src/site-seo.json|artifacts/mahjong-scorer/src/site-seo.test.ts|.github/workflows/tmp-179-phase-a.yml'
          unexpected=$(git status --short | sed -E 's/^.. //' | grep -Ev "^(${allowed})$" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi
      - name: Verify product
        run: |
          pnpm test
          pnpm run typecheck
          PORT=5173 BASE_PATH=/ pnpm run build
      - name: Commit verified User Guide integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote Help to Table Companion User Guide'
          git push
