name: Validate help screenshot tile fix

on:
  push:
    branches:
      - feature/issue-53-responsive-howto
    paths:
      - artifacts/mahjong-scorer/package.json
      - artifacts/mahjong-scorer/scripts/capture-help-screenshots.mjs
      - .github/workflows/help-screenshot-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-53-responsive-howto

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @workspace/mahjong-scorer test

      - name: Typecheck
        run: pnpm --filter @workspace/mahjong-scorer typecheck

      - name: Build
        env:
          PORT: 4173
          BASE_PATH: /
        run: pnpm --filter @workspace/mahjong-scorer build

      - name: Regenerate help screenshots with tile submodule
        run: pnpm --filter @workspace/mahjong-scorer screenshots:help

      - name: Verify tile SVGs are present
        run: |
          test -f artifacts/mahjong-scorer/src/assets/riichi-mahjong-tiles/Regular/Man1.svg
          test -f artifacts/mahjong-scorer/src/assets/riichi-mahjong-tiles/Regular/Flower1.svg

      - name: Commit regenerated screenshots
        run: |
          git add artifacts/mahjong-scorer/public/help/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate help screenshots with tile artwork [screenshots]"
          git push origin HEAD:feature/issue-53-responsive-howto
